function doAuth(kind){var e=document.getElementById("em"),p=document.getElementById("pw"),em=e&&e.value.trim(),pw=p&&p.value;if(!em||!pw||pw.length<8){S.am="أدخل بريدًا صحيحًا وكلمة مرور من 8 أحرف على الأقل.";render();keep(em);return}S.am="جارٍ التنفيذ…";render();auth(kind==="signup"?"signup":"token",em,pw).then(function(d){if(setSess(d)){S.am="";pull()}else{S.am="تحقّق من بريدك لتأكيد الحساب ثم سجّل الدخول."}}).catch(function(x){S.am="تعذّر التنفيذ: "+(x.message||"")}).then(function(){render();keep(em)})}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function chatView(){var L=cur(),h='<button data-a="lesson">رجوع للدرس</button><h2>محادثة: '+esc(L.t)+'</h2>';if(!CHAT_URL)return h+'<div class="box"><p style="margin:0">المحادثة الذكية غير مفعّلة بعد، وتُفعَّل عند ربط الخادم (المرحلة 2).</p></div>';h+='<div class="box">';if(!S.chat.length)h+='<p class="m" style="margin:0">اكتب جملة تطبّق فيها الدرس لتبدأ.</p>';S.chat.forEach(function(m){h+='<div class="msg '+m.r+'" dir="auto">'+esc(m.x)+'</div>'});if(S.busy)h+='<p class="m" style="margin:0">…</p>';if(S.left!=null)h+='<p class="m" style="margin:.5rem 0 0">المتبقي هذا الشهر: '+S.left+' رسالة</p>';return h+'</div><div class="row" style="border:0"><input id="in" dir="auto" maxlength="300" placeholder="اكتب هنا"><button class="pri" data-a="send">إرسال</button></div>'}
function refreshTok(){return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:sbH(),body:JSON.stringify({refresh_token:SBS.r})}).then(function(x){return x.json()}).then(function(d){if(!setSess(d)){clearSess();throw 0}})}
function send(L){var i=document.getElementById("in"),t=i&&i.value.trim();if(!t||S.busy)return;if(sbOn()&&!SBS){S.chat.push({r:"t",x:"سجّل الدخول من الصفحة الرئيسية لاستعمال المحادثة."});render();return}S.chat.push({r:"u",x:t});S.busy=true;render();var body=JSON.stringify({lang:L.l,lesson:L.t,rule:L.r,messages:S.chat.slice(-8)});function go(retry){var h={"Content-Type":"application/json"};if(SBS)h.Authorization="Bearer "+SBS.t;return fetch(CHAT_URL,{method:"POST",headers:h,body:body}).then(function(r){if(r.status===401&&SBS&&SBS.r&&!retry)return refreshTok().then(function(){return go(1)});if(r.status===429)throw 429;if(!r.ok)throw 0;return r.json()})}go().then(function(d){S.chat.push({r:"t",x:String(d.reply||"").slice(0,800)});S.left=d.remaining}).catch(function(c){S.chat.push({r:"t",x:c===429?"انتهت رسائل المحادثة لهذا الشهر.":"تعذّر الاتصال بالخادم. حاول لاحقًا."})}).then(function(){S.busy=false;render()})}
function initAds(){var pl=nativePlugin("AdMob");if(!pl||ADS.mode!=="admob")return;try{pl.initialize({}).then(function(){return pl.requestConsentInfo()}).then(function(c){if(c&&c.isConsentFormAvailable&&c.status==="REQUIRED")return pl.showConsentForm()}).catch(function(){})}catch(e){}}
function needAd(){return ADS.mode!=="off"&&((P._l||0)+1)%Math.max(1,ADS.every)===0}
function showAd(){return new Promise(function(res){
  if(ADS.mode==="demo"){S.st="ad";S.cd=5;S.adRes=res;render();var t=setInterval(function(){S.cd--;if(S.cd<=0)clearInterval(t);if(S.st==="ad")render()},1000);return}
  var pl=nativePlugin("AdMob");
  if(!pl){res(false);return}
  var done=false,to=setTimeout(function(){fin(false)},20000);
  function fin(v){if(done)return;done=true;clearTimeout(to);res(v)}
  try{
    pl.addListener("onRewardedVideoAdReward",function(){fin(true)});
    pl.addListener("onRewardedVideoAdDismissed",function(){setTimeout(function(){fin(false)},400)});
    pl.addListener("onRewardedVideoAdFailedToLoad",function(){fin(false)});
    pl.prepareRewardVideoAd({adId:ADS.unit,isTesting:true}).then(function(){clearTimeout(to);return pl.showRewardVideoAd()}).catch(function(){fin(false)})
  }catch(e){fin(false)}
})}
function watchAd(){S.adMsg="";showAd().then(function(ok){if(ok){P._l=(P._l||0)+1;save();sync();S.st="speak";S.res="";S.skip=false}else{S.st="gate";S.adMsg="تعذّر عرض الإعلان الآن.";S.skip=true}render()})}
function adView(){
  if(S.st==="ad")return '<div class="box" style="text-align:center"><p class="m">إعلان تجريبي</p><div class="big">'+(S.cd>0?S.cd:"✓")+'</div><p>هذه شاشة تجريبية تحاكي الإعلان. في النسخة الحقيقية يظهر هنا إعلان فيديو من Google.</p></div>'+(S.cd>0?"":'<button class="pri opt" data-a="adok">متابعة الدرس</button>');
  return '<button data-a="back">رجوع</button><h2>أحسنت في التمارين!</h2><p>لمتابعة الدرس شاهد إعلانًا قصيرًا. هذا يُبقي التطبيق مجانيًا.</p>'+(S.adMsg?'<p class="m">'+esc(S.adMsg)+'</p>':"")+'<button class="pri opt" data-a="watch">▶ شاهد الإعلان وتابع</button>'+(S.skip?'<button class="opt" data-a="skipad">تابع بدون إعلان</button>':"")}
function render(){A.innerHTML=S.acct?acctView():S.id?(S.st==="chat"?chatView():S.st==="gate"||S.st==="ad"?adView():lesson()):home()}
function ask(){var q=cur().q[S.qi];S.pick="";S.opts=sh(q[1])}
A.onclick=function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,L=S.id?cur():null;
  if(a==="tab"){S.tab=v}
  else if(a==="open"){S.id=v;S.st="learn";S.qi=0;S.sc=0;S.res=""}
  else if(a==="back"){S.id=null}
  else if(a==="say"){speak(v,L?L.l:S.tab);return}
  else if(a==="quiz"){S.st="quiz";S.qi=0;S.sc=0;ask()}
  else if(a==="ans"){if(S.pick)return;S.pick=v;if(v===L.q[S.qi][2])S.sc++}
  else if(a==="next"){if(S.qi<L.q.length-1){S.qi++;ask()}else if(needAd()){S.st="gate";S.adMsg="";S.skip=false}else{P._l=(P._l||0)+1;save();S.st="speak";S.res=""}}
  else if(a==="mic"){listen(L);return}
  else if(a==="chat"){S.st="chat";S.chat=[];S.busy=false}
  else if(a==="send"){send(L);return}
  else if(a==="watch"){watchAd();return}
  else if(a==="adok"){if(S.adRes){var rr=S.adRes;S.adRes=null;rr(true)}return}
  else if(a==="skipad"){S.st="speak";S.res="";S.skip=false}
  else if(a==="lesson"){S.st="speak"}
  else if(a==="acct"){S.acct=true;S.am="";S.cf=false}
  else if(a==="accback"){S.acct=false;S.cf=false}
  else if(a==="login"||a==="signup"){doAuth(a);return}
  else if(a==="logout"){clearSess();S.am=""}
  else if(a==="delacct"){if(!S.cf){S.cf=true}else{sbFetch("/rest/v1/rpc/delete_my_account",{method:"POST",body:"{}"}).then(function(r){if(!r.ok)throw 0;clearSess();S.am="تم حذف الحساب.";S.cf=false}).catch(function(){S.am="تعذّر الحذف. حاول لاحقًا."}).then(render);return}}
  else if(a==="done"){S.st="end";if(P[L.id]==null||P[L.id]<S.sc){P[L.id]=S.sc}P._x=(P._x||0)+10*S.sc+5;var d=dstr(0);if(P._d!==d){var y=dstr(1);P._s=(P._d===y?(P._s||0):0)+1;P._d=d}save();sync()}
  render();
};
initAds();
render();
})();
</script>
</body>
</html>
