<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الإنجليزية والفرنسية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#F5F8FB;--sf:#FFFFFF;--ink:#12263A;--mu:#4B5F73;--br:#2F4BD8;--on:#FFFFFF;--ac:#F2A93B;--ln:#D7E0EA;--ok:#17724A;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1624;--sf:#15233A;--ink:#EAF0F7;--mu:#A5B4C6;--br:#8EA1FF;--on:#0D1624;--ac:#F2B552;--ln:#27385A;--ok:#6FD3A0;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1624;--sf:#15233A;--ink:#EAF0F7;--mu:#A5B4C6;--br:#8EA1FF;--on:#0D1624;--ac:#F2B552;--ln:#27385A;--ok:#6FD3A0;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.75 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.w{max-width:600px;margin:0 auto;padding:1.5rem 1.1rem 3rem}
h1{font-size:1.7rem;line-height:1.4;margin:.6rem 0 .3rem}
h2{font-size:1.3rem;margin:.5rem 0 .75rem}
p{color:var(--mu);margin:0 0 1rem}
.tag{display:inline-block;background:var(--ac);color:#12263A;font-weight:600;font-size:.85rem;padding:.1rem .7rem;border-radius:999px}
.tabs{display:flex;gap:.5rem;margin:1rem 0}
.tabs button{flex:1}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:.4rem 1rem}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on,button.pri{background:var(--br);color:var(--on);border-color:var(--br);font-weight:700}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;margin:.5rem 0;background:var(--sf)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:1rem;margin:0 0 1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.f{direction:ltr;unicode-bidi:isolate;font-family:Georgia,"Times New Roman",serif;font-size:1.15rem}
.opt{display:block;width:100%;margin:.5rem 0;text-align:center}
.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{border-color:var(--bad);color:var(--bad)}
.m{color:var(--mu);font-size:.9rem}
.big{font-size:1.4rem;text-align:center;margin:1rem 0}
.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:.5rem}
.bar i{display:block;height:100%;background:var(--br)}
.sec{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:.9rem 1rem;margin:0 0 1rem}
.sec b,.box b{display:block;margin-bottom:.35rem}
.sec ul{margin:.2rem 0;padding-inline-start:1.2rem;color:var(--mu)}
.sec li{margin:.35rem 0}
.sec p{margin:.2rem 0}
.warn{border-color:var(--ac)}
.err{padding:.5rem 0;border-top:1px solid var(--ln)}
.err:first-of-type{border-top:0}
.err p{margin:.2rem 0 0;font-size:.95rem}
.bad{color:var(--bad)}
.good{color:var(--ok)}
.msg{padding:.6rem .9rem;border-radius:14px;margin:.5rem 0;line-height:1.6;white-space:pre-wrap}
.msg.u{background:var(--br);color:var(--on)}
.msg.t{background:var(--bg);border:1px solid var(--ln)}
input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 .8rem;font:inherit}
</style>
</head>

<main class="w" id="app"></main>

<script>
(function(){
var D=[
{"id":"fr4","l":"fr","t":"التحيات والتعارف","r":"عبارات التحية والتعارف حسب الوقت والمقام (tu أو vous).","w":["عند لقاء أي شخص أو مغادرته.","للتعريف بنفسك وسؤال الآخرين عن أسمائهم وأحوالهم.","للتمييز بين المخاطبة الودّية (tu) والمخاطبة الرسمية (vous)."],"rl":["Bonjour تُقال طوال النهار، وBonsoir مساءً، وBonne nuit عند الذهاب إلى النوم فقط.","Salut للأصدقاء والأقارب، وتُقال عند اللقاء وعند الوداع.","للسؤال عن الحال: Comment ça va ؟ (عادي) أو Comment allez-vous ؟ (رسمي).","للجواب: Ça va bien, merci. Et toi ؟ (عادي) أو Et vous ؟ (رسمي).","tu للصديق والقريب والطفل، وvous للغريب والأكبر سنًّا وفي المقام الرسمي.","للتعريف بنفسك: Je m’appelle … ، وللسؤال: Comment tu t’appelles ؟ أو Comment vous appelez-vous ؟"],"tb":[["Bonjour","مرحبًا / صباح الخير"],["Bonsoir","مساء الخير"],["Salut","سلام (للأصدقاء)"],["Au revoir","إلى اللقاء"],["Bonne nuit","تصبح على خير"],["Merci","شكرًا"],["S’il vous plaît","من فضلك (رسمي)"],["Excusez-moi","المعذرة"]],"e":[["Bonjour, comment ça va ?","مرحبًا، كيف حالك؟"],["Ça va bien, merci.","بخير، شكرًا."],["Je m’appelle Sara.","اسمي سارة."],["Comment tu t’appelles ?","ما اسمك؟"],["Enchanté !","سررت بلقائك!"],["Comment allez-vous ?","كيف حالكم؟ (رسمي)"],["À demain !","إلى الغد!"],["Merci beaucoup.","شكرًا جزيلًا."]],"er":[["Bonne nuit, comment ça va ?","Bonsoir, comment ça va ?","Bonne nuit للوداع قبل النوم فقط، وليست تحية."],["Je suis appelle Sara.","Je m’appelle Sara.","التعبير الثابت هو je m’appelle، ولا نقول je suis appelle."],["Comment tu appelles ?","Comment tu t’appelles ?","الفعل s’appeler يحتاج الضمير t’ مع tu."],["Vous allez bien ? — Oui, et tu ?","Vous allez bien ? — Oui, et vous ?","نحافظ على المقام نفسه: إن بدأت بـ vous فتابع بـ vous."]],"tp":"إن لم تكن متأكدًا من المقام ففي اللقاء الأول استعمل vous، فهو الأحوط. وإن أرادوا الانتقال إلى tu سيقولون لك.","d":[["Bonjour ! Je m’appelle Sara. Et vous ?","مرحبًا! اسمي سارة. وأنتم؟"],["Bonjour, je m’appelle Youssef. Enchanté !","مرحبًا، اسمي يوسف. سررت!"],["Enchantée. Comment allez-vous ?","سررت. كيف حالكم؟"],["Ça va bien, merci. Et vous ?","بخير، شكرًا. وأنتم؟"]],"h":"Bonjour نهارًا، Bonsoir مساءً، Bonne nuit قبل النوم. وtu للأصدقاء وvous للمقام الرسمي.","q":[["Bonjour, ___ ?",["comment ça va","au revoir","merci"],"comment ça va","نسأل عن الحال بـ Comment ça va ؟"],["— Merci ! — De ___.",["rien","bonjour","nom"],"rien","الجواب على merci هو De rien."],["Le soir, on dit : ___.",["Bonsoir","Bonjour","Bonne nuit"],"Bonsoir","Bonsoir للتحية مساءً."],["Avant de dormir, on dit : ___.",["Bonne nuit","Bonsoir","Bonjour"],"Bonne nuit","Bonne nuit للوداع قبل النوم."],["Je ___ Sara.",["m’appelle","suis appelle","appelle"],"m’appelle","التعبير الثابت: je m’appelle."],["À un professeur, on dit : « Comment ___-vous ? »",["allez","vas","va"],"allez","مع vous نستعمل allez."],["À un ami, on dit : « Comment ça ___ ? »",["va","vas","allez"],"va","Comment ça va ؟ عبارة ثابتة."],["كيف تقول: «اسمي سارة»؟",["Je m’appelle Sara.","Je suis appelle Sara.","Mon nom est appelle Sara."],"Je m’appelle Sara.","التعبير الثابت: Je m’appelle."]],"s":["Bonjour, comment ça va ?","Je m’appelle Sara.","Enchanté !"]},
{"id":"fr1","l":"fr","t":"الفعل être: أكون","r":"نستعمل être للتعريف بنفسك وبالآخرين ولوصف الحالة والمكان.","w":["للتعريف بنفسك وبالآخرين: «أنا طالب»، «هي معلّمة».","لوصف الحالة والصفات: «أنا متعب»، «هم سعداء».","للجنسية والمهنة والمكان: «أنا مغربي»، «نحن في الرباط»."],"rl":["être يعني «يكون». في العربية نقول «أنا طالب» دون فعل، أما في الفرنسية فلا نحذفه أبدًا.","يتغيّر شكله حسب الضمير، كما في الجدول أدناه، وهو فعل شاذ يجب حفظه.","بعده تأتي الصفة أو المهنة أو الجنسية أو المكان.","مع المهنة والجنسية نحذف الأداة غالبًا عند التعريف بالنفس: Je suis étudiant هي الصيغة الأشيع.","الصفة تتبع الجنس والعدد: il est fatigué، elle est fatiguée، ils sont fatigués."],"tb":[["je suis","أنا أكون"],["tu es","أنتَ / أنتِ تكون"],["il est / elle est","هو / هي يكون"],["nous sommes","نحن نكون"],["vous êtes","أنتم تكونون (أو أنتَ بأدب)"],["ils sont / elles sont","هم / هنّ يكنّ"]],"e":[["Je suis marocain.","أنا مغربي."],["Tu es fatigué ?","هل أنتَ متعب؟"],["Il est médecin.","هو طبيب."],["Elle est étudiante.","هي طالبة."],["Nous sommes à Rabat.","نحن في الرباط."],["Vous êtes prêts ?","هل أنتم جاهزون؟"],["Ils sont contents.","هم سعداء."],["Elles sont amies.","هنّ صديقات."]],"er":[["Je étudiant.","Je suis étudiant.","العربية تقول «أنا طالب» دون فعل، أما الفرنسية فتحتاج دائمًا إلى être."],["Elle est fatigué.","Elle est fatiguée.","الصفة تتبع الجنس: نضيف e مع المؤنث."],["Nous sommes fatigué.","Nous sommes fatigués.","الصفة تتبع العدد: نضيف s مع الجمع."],["Vous es prêts.","Vous êtes prêts.","vous êtes شكل شاذ، فلا نقول vous es."]],"tp":"أكثر جملة ستستعملها في الفرنسية تبدأ بـ je suis. اقرأ الجدول بصوت عالٍ مرتين يوميًا حتى يصير تلقائيًا.","d":[["Bonjour, je suis Sara.","مرحبًا، أنا سارة."],["Bonjour Sara, je suis Youssef. Tu es étudiante ?","مرحبًا سارة، أنا يوسف. هل أنتِ طالبة؟"],["Oui, je suis étudiante. Et toi ?","نعم، أنا طالبة. وأنتَ؟"],["Moi, je suis professeur.","أنا أستاذ."]],"h":"تذكّر: être لا يُحذف أبدًا، ويتغيّر حسب الضمير: suis / es / est / sommes / êtes / sont.","q":[["Je ___ maroca function doAuth(kind){var e=document.getElementById("em"),p=document.getElementById("pw"),em=e&&e.value.trim(),pw=p&&p.value;if(!em||!pw||pw.length<8){S.am="أدخل بريدًا صحيحًا وكلمة مرور من 8 أحرف على الأقل.";render();keep(em);return}S.am="جارٍ التنفيذ…";render();auth(kind==="signup"?"signup":"token",em,pw).then(function(d){if(setSess(d)){S.am="";pull()}else{S.am="تحقّق من بريدك لتأكيد الحساب ثم سجّل الدخول."}}).catch(function(x){S.am="تعذّر التنفيذ: "+(x.message||"")}).then(function(){render();keep(em)})}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function chatView(){var L=cur(),h='<button data-a="lesson">رجوع للدرس</button><h2>محادثة: '+esc(L.t)+'</h2>';if(!CHAT_URL)return h+'<div class="box"><p style="margin:0">المحادثة الذكية غير مفعّلة بعد، وتُفعَّل عند ربط الخادم (المرحلة 2).</p></div>';h+='<div class="box">';if(!S.chat.length)h+='<p class="m" style="margin:0">اكتب جملة تطبّق فيها الدرس لتبدأ.</p>';S.chat.forEach(function(m){h+='<div class="msg '+m.r+'" dir="auto">'+esc(m.x)+'</div>'});if(S.busy)h+='<p class="m" style="margin:0">…</p>';if(S.left!=null)h+='<p class="m" style="margin:.5rem 0 0">المتبقي هذا الشهر: '+S.left+' رسالة</p>';return h+'</div><div class="row" style="border:0"><input id="in" dir="auto" maxlength="300" placeholder="اكتب هنا"><button class="pri" data-a="send">إرسال</button></div>'}
function refreshTok(){return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:sbH(),body:JSON.stringify({refresh_token:SBS.r})}).then(function(x){return x.json()}).then(function(d){if(!setSess(d)){clearSess();throw 0}})}
function send(L){var i=document.getElementById("in"),t=i&&i.value.trim();if(!t||S.busy)return;if(sbOn()&&!SBS){S.chat.push({r:"t",x:"سجّل الدخول من الصفحة الرئيسية لاستعمال المحادثة."});render();return}S.chat.push({r:"u",x:t});S.busy=true;render();var body=JSON.stringify({lang:L.l,lesson:L.t,rule:L.r,messages:S.chat.slice(-8)});function go(retry){var h={"Content-Type":"application/json"};if(SBS)h.Authorization="Bearer "+SBS.t;return fetch(CHAT_URL,{method:"POST",headers:h,body:body}).then(function(r){if(r.status===401&&SBS&&SBS.r&&!retry)return refreshTok().then(function(){return go(1)});if(r.status===429)throw 429;if(!r.ok)throw 0;return r.json()})}go().then(function(d){S.chat.push({r:"t",x:String(d.reply||"").slice(0,800)});S.left=d.remaining}).catch(function(c){S.chat.push({r:"t",x:c===429?"انتهت رسائل المحادثة لهذا الشهر.":"تعذّر الاتصال بالخادم. حاول لاحقًا."})}).then(function(){S.busy=false;render()})}
function initAds(){var pl=nativePlugin("AdMob");if(!pl||ADS.mode!=="admob")return;try{pl.initialize({}).then(function(){return pl.requestConsentInfo()}).then(function(c){if(c&&c.isConsentFormAvailable&&c.status==="REQUIRED")return pl.showConsentForm()}).catch(function(){})}catch(e){}}
function needAd(){return ADS.mode!=="off"&&((P._l||0)+1)%Math.max(1,ADS.every)===0}
function showAd(){return new Promise(function(res){
  if(ADS.mode==="demo"){S.st="ad";S.cd=5;S.adRes=res;render();var t=setInterval(function(){S.cd--;if(S.cd<=0)clearInterval(t);if(S.st==="ad")render()},1000);return}
  var pl=nativePlugin("AdMob");
  if(!pl){res(false);return}
  var done=false,to=setTimeout(function(){fin(false)},20000);
  function fin(v){if(done)return;done=true;clearTimeout(to);res(v)}
  try{
    pl.addListener("onRewardedVideoAdReward",function(){fin(true)});
    pl.addListener("onRewardedVideoAdDismissed",function(){setTimeout(function(){fin(false)},400)});
    pl.addListener("onRewardedVideoAdFailedToLoad",function(){fin(false)});
    pl.prepareRewardVideoAd({adId:ADS.unit,isTesting:true}).then(function(){clearTimeout(to);return pl.showRewardVideoAd()}).catch(function(){fin(false)})
  }catch(e){fin(false)}
})}
function watchAd(){S.adMsg="";showAd().then(function(ok){if(ok){P._l=(P._l||0)+1;save();sync();S.st="speak";S.res="";S.skip=false}else{S.st="gate";S.adMsg="تعذّر عرض الإعلان الآن.";S.skip=true}render()})}
function adView(){
  if(S.st==="ad")return '<div class="box" style="text-align:center"><p class="m">إعلان تجريبي</p><div class="big">'+(S.cd>0?S.cd:"✓")+'</div><p>هذه شاشة تجريبية تحاكي الإعلان. في النسخة الحقيقية يظهر هنا إعلان فيديو من Google.</p></div>'+(S.cd>0?"":'<button class="pri opt" data-a="adok">متابعة الدرس</button>');
  return '<button data-a="back">رجوع</button><h2>أحسنت في التمارين!</h2><p>لمتابعة الدرس شاهد إعلانًا قصيرًا. هذا يُبقي التطبيق مجانيًا.</p>'+(S.adMsg?'<p class="m">'+esc(S.adMsg)+'</p>':"")+'<button class="pri opt" data-a="watch">▶ شاهد الإعلان وتابع</button>'+(S.skip?'<button class="opt" data-a="skipad">تابع بدون إعلان</button>':"")}
function render(){A.innerHTML=S.acct?acctView():S.id?(S.st==="chat"?chatView():S.st==="gate"||S.st==="ad"?adView():lesson()):home()}
function ask(){var q=cur().q[S.qi];S.pick="";S.opts=sh(q[1])}
A.onclick=function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,L=S.id?cur():null;
  if(a==="tab"){S.tab=v}
  else if(a==="open"){S.id=v;S.st="learn";S.qi=0;S.sc=0;S.res="";S.si=0}
  else if(a==="back"){S.id=null}
  else if(a==="say"){speak(v,L?L.l:S.tab);return}
  else if(a==="quiz"){S.st="quiz";S.sc=0;S.miss=[];S.rev=false;S.si=0;S.seq=L.q.map(function(_,i){return i});S.pos=0;S.qi=0;ask()}
  else if(a==="ans"){if(S.pick)return;S.pick=v;if(v===L.q[S.qi][2]){if(!S.rev)S.sc++}else if(!S.rev){S.miss.push(S.qi)}}
  else if(a==="next"){S.pos++;if(S.pos<S.seq.length){S.qi=S.seq[S.pos];ask()}else if(!S.rev&&S.miss.length){S.rev=true;S.seq=S.miss.slice();S.pos=0;S.qi=S.seq[0];ask()}else if(needAd()){S.st="gate";S.adMsg="";S.skip=false}else{P._l=(P._l||0)+1;save();S.st="speak";S.res=""}}
  else if(a==="nextsent"){S.si=(S.si||0)+1;S.res=""}
  else if(a==="mic"){listen(L);return}
  else if(a==="chat"){S.st="chat";S.chat=[];S.busy=false}
  else if(a==="send"){send(L);return}
  else if(a==="watch"){watchAd();return}
  else if(a==="adok"){if(S.adRes){var rr=S.adRes;S.adRes=null;rr(true)}return}
  else if(a==="skipad"){S.st="speak";S.res="";S.skip=false}
  else if(a==="lesson"){S.st="speak"}
  else if(a==="acct"){S.acct=true;S.am="";S.cf=false}
  else if(a==="accback"){S.acct=false;S.cf=false}
  else if(a==="login"||a==="signup"){doAuth(a);return}
  else if(a==="logout"){clearSess();S.am=""}
  else if(a==="delacct"){if(!S.cf){S.cf=true}else{sbFetch("/rest/v1/rpc/delete_my_account",{method:"POST",body:"{}"}).then(function(r){if(!r.ok)throw 0;clearSess();S.am="تم حذف الحساب.";S.cf=false}).catch(function(){S.am="تعذّر الحذف. حاول لاحقًا."}).then(render);return}}
  else if(a==="done"){S.st="end";var pcd=S.sc/L.q.length,stz=pcd>=0.9?3:pcd>=0.6?2:1;if(P[L.id]==null||P[L.id]<stz){P[L.id]=stz}P._x=(P._x||0)+Math.round(30*pcd)+5;var d=dstr(0);if(P._d!==d){var y=dstr(1);P._s=(P._d===y?(P._s||0):0)+1;P._d=d}save();sync()}
  render();
};
initAds();
render();
})();
</script>
</body>
